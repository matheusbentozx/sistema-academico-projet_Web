# ===============================================================
# Perfil "h2": banco em memoria, para rodar SEM instalar MySQL
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Os dados sao perdidos ao parar a aplicacao.
# Console do banco: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:sistema_academico  | usuario: sa | senha: (vazia)
# ===============================================================
spring.datasource.url=jdbc:h2:mem:sistema_academico;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
