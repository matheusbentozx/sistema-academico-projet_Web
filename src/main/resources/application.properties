# ===============================================================
# Configuracao padrao: MySQL
# Ajuste usuario/senha aqui ou via variaveis de ambiente DB_USER / DB_PASSWORD
# O banco "sistema_academico" e criado automaticamente se nao existir.
# ===============================================================
spring.application.name=sistema-academico
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/sistema_academico?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# "update" cria/ajusta as tabelas a partir das entidades sem apagar os dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mensagens de erro mais limpas
server.error.include-message=always
